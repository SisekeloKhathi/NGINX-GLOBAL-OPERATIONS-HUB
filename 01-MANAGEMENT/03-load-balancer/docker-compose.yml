services:

  nginx:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  backend-1:
    build:
      context: ./backend-1
    container_name: nginx-backend-1

  backend-2:
    build:
      context: ./backend-2
    container_name: nginx-backend-2

  backend-3:
    build:
      context: ./backend-3
    container_name: nginx-backend-3
