services:

  nginx:
    image: nginx:alpine
    container_name: nginx-cache
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: nginx-cache-backend

volumes:
  nginx_cache:
