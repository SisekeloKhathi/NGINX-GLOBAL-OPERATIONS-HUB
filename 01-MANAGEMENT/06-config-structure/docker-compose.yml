services:

  nginx:
    image: nginx:alpine
    container_name: nginx-config-structure
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: nginx-config-backend
