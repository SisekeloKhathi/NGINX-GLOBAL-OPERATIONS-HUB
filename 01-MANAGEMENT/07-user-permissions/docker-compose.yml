services:

  nginx:
    image: nginx:alpine
    container_name: nginx-permissions
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: nginx-permissions-backend
