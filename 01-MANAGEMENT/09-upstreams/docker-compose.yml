services:

  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-upstreams
    ports:
      - "8091:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - lab-network

  backend-1:
    build:
      context: ./backend-1
    image: nginx-lab-upstream-backend-1
    container_name: nginx-upstream-backend-1
    networks:
      - lab-network

  backend-2:
    build:
      context: ./backend-2
    image: nginx-lab-upstream-backend-2
    container_name: nginx-upstream-backend-2
    networks:
      - lab-network

networks:

  lab-network:
    driver: bridge
