events {}

http {

    server {
        listen 80;

        location / {
            proxy_pass http://backend:8080;

            add_header X-Backend-Status $upstream_status;
            add_header X-Response-Time $upstream_response_time;
        }

        location /health {
            proxy_pass http://backend:8080;
        }

        location /metrics {
            proxy_pass http://backend:8080;
        }
    }
}
