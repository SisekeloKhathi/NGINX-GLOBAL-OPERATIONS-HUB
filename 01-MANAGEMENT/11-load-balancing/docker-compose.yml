services:
  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-lb
    ports:
      - "8093:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - lb-network

  backend1:
    build: ./backend1
    image: nginx-lab-lb-backend1
    container_name: lb-backend1
    networks:
      - lb-network

  backend2:
    build: ./backend2
    image: nginx-lab-lb-backend2
    container_name: lb-backend2
    networks:
      - lb-network

networks:
  lb-network:
    driver: bridge
