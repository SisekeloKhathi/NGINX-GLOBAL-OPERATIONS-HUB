events {}

http {
    upstream backend {
        ip_hash;
        server backend1:8080;
        server backend2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /stats {
            stub_status;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
