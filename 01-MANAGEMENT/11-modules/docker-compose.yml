services:

  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-modules
    depends_on:
      - backend
    ports:
      - "8093:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lab-network

  backend:
    build:
      context: ./backend
    image: nginx-lab-modules-backend
    container_name: nginx-modules-backend
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
