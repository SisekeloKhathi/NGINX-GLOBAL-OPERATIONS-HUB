events {}

http {
    # Define rate limiting zones - MORE STRICT
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=strict:10m rate=1r/m;

    server {
        listen 80;

        # Apply rate limiting with small burst
        location / {
            limit_req zone=mylimit burst=2 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Stricter rate limiting for slow endpoint
        location /slow {
            limit_req zone=strict burst=1;
            proxy_pass http://backend:8080/slow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
