services:

  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-health
    depends_on:
      - backend1
      - backend2
    ports:
      - "8096:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - health-network

  backend1:
    build: ./backend1
    image: nginx-lab-health-backend1
    container_name: health-backend1
    networks:
      - health-network

  backend2:
    build: ./backend2
    image: nginx-lab-health-backend2
    container_name: health-backend2
    networks:
      - health-network

networks:
  health-network:
    driver: bridge
