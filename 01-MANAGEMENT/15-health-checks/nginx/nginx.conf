events {}

http {

    upstream backend_pool {
        server backend1:8080 max_fails=2 fail_timeout=10s;
        server backend2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://backend_pool;
        }
    }
}
