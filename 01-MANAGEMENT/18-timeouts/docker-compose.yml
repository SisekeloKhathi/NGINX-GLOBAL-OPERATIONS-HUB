services:

  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-timeouts
    depends_on:
      - backend
    ports:
      - "8099:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  backend:
    build:
      context: ./backend
    image: nginx-lab-timeout-backend
    container_name: timeout-backend
