services:

  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-load-balancing
    depends_on:
      - backend1
      - backend2
      - backend3
    ports:
      - "8100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  backend1:
    build:
      context: ./backend1
    image: nginx-lab-lb-backend1
    container_name: lb-backend1

  backend2:
    build:
      context: ./backend2
    image: nginx-lab-lb-backend2
    container_name: lb-backend2

  backend3:
    build:
      context: ./backend3
    image: nginx-lab-lb-backend3
    container_name: lb-backend3
