services:

  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-weighted
    depends_on:
      - backend1
      - backend2
    ports:
      - "8102:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  backend1:
    build:
      context: ./backend1
    image: nginx-lab-weighted-backend1
    container_name: weighted-backend1

  backend2:
    build:
      context: ./backend2
    image: nginx-lab-weighted-backend2
    container_name: weighted-backend2
