services:

  nginx:
    image: nginx-lab-nginx:alpine
    container_name: nginx-least-conn
    depends_on:
      - backend1
      - backend2
    ports:
      - "8103:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  backend1:
    build:
      context: ./backend1
    image: nginx-lab-least-backend1
    container_name: least-backend1

  backend2:
    build:
      context: ./backend2
    image: nginx-lab-least-backend2
    container_name: least-backend2
