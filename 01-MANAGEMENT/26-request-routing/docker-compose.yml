services:

  nginx:
    image: nginx:alpine
    container_name: nginx-routing
    depends_on:
      - app1
      - app2
      - api
    ports:
      - "8107:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  app1:
    build: ./app1
    container_name: routing-app1

  app2:
    build: ./app2
    container_name: routing-app2

  api:
    build: ./api
    container_name: routing-api
