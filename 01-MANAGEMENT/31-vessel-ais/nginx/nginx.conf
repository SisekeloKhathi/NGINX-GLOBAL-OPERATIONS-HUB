events {}

http {
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;

        location /vessels {
            proxy_ssl_server_name on;
            proxy_ssl_name ais.openwaters.io;
            proxy_set_header Host ais.openwaters.io;

            proxy_pass https://ais.openwaters.io/v1/vessels;
        }
    }
}
