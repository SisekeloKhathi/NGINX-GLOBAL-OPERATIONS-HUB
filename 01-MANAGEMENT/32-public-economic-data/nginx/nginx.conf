events {}

http {
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;

        location /gdp {
            proxy_ssl_server_name on;
            proxy_ssl_name api.worldbank.org;
            proxy_set_header Host api.worldbank.org;

            proxy_pass https://api.worldbank.org/v2/country/zaf/indicator/NY.GDP.MKTP.CD?format=json;
        }
    }
}
