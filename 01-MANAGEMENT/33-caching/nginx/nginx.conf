events {}

http {

    resolver 127.0.0.11 valid=30s;

    proxy_cache_path /var/cache/nginx
        keys_zone=economic_cache:10m
        max_size=100m
        inactive=60s
        use_temp_path=off;

    server {
        listen 80;

        location /gdp {

            proxy_cache economic_cache;
            proxy_cache_valid 200 60s;

            proxy_cache_key "$scheme$proxy_host$request_uri";

            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_ssl_server_name on;
            proxy_ssl_name api.worldbank.org;
            proxy_set_header Host api.worldbank.org;

            proxy_pass https://api.worldbank.org/v2/country/zaf/indicator/NY.GDP.MKTP.CD?format=json;
        }
    }
}
