services:

  nginx:
    image: nginx:alpine
    container_name: nginx-basic-auth
    ports:
      - "8117:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: basic-auth-backend
