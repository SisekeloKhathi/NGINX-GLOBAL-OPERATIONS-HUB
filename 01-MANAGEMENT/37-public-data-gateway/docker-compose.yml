services:

  nginx:
    image: nginx:alpine
    container_name: nginx-public-data-gateway
    ports:
      - "8118:80"
    volumes:
      # Existing NGINX configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Existing TLS certificates
      - ../../secrets:/etc/nginx/secrets:ro

      # Public website served by NGINX
      - ../../web/public:/usr/share/nginx/html:ro

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - ops-network

volumes:
  redis-data:
