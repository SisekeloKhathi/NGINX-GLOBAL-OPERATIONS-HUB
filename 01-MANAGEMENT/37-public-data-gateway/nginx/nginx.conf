events {}

http {

    server {
        listen 80;

        # 🌦️ Weather
        location /api/weather/ {
            proxy_ssl_server_name on;
            proxy_ssl_name api.open-meteo.com;

            proxy_pass https://api.open-meteo.com/;
        }

        # 💱 Currency / FX
        location /api/fx/ {
            proxy_ssl_server_name on;
            proxy_ssl_name open.er-api.com;

            proxy_pass https://open.er-api.com/;
        }

        # ✈️ Flight data
        location /api/flights/ {
            proxy_ssl_server_name on;
            proxy_ssl_name opensky-network.org;

            proxy_pass https://opensky-network.org/;
        }

        # 🚢 Vessel / AIS
        location /api/vessels/ {
            proxy_ssl_server_name on;
            proxy_ssl_name ais.openwaters.io;

            proxy_pass https://ais.openwaters.io/;
        }

        # 📊 Economic data
        location /api/economics/ {
            proxy_ssl_server_name on;
            proxy_ssl_name api.worldbank.org;

            proxy_pass https://api.worldbank.org/;
        }
    }
}
