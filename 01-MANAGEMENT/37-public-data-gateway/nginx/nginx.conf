user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"cache_status":"$upstream_cache_status"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 500;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    proxy_cache_path /var/cache/nginx/weather
        keys_zone=weather_cache:10m max_size=200m
        inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/fx
        keys_zone=fx_cache:10m max_size=50m
        inactive=30m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/flights
        keys_zone=flights_cache:10m max_size=100m
        inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/vessels
        keys_zone=vessels_cache:10m max_size=100m
        inactive=30m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/economics
        keys_zone=econ_cache:10m max_size=100m
        inactive=24h use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=flights_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=fx_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=weather_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=vessels_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=econ_limit:10m rate=10r/m;

    limit_req_status 429;
    limit_conn_status 429;

    upstream weather_upstream {
        server api.open-meteo.com:443;
        keepalive 16;
    }

    upstream fx_upstream {
        server open.er-api.com:443;
        keepalive 8;
    }

    upstream flights_upstream {
        server opensky-network.org:443;
        keepalive 4;
    }

    upstream vessels_upstream {
        server ais.openwaters.io:443;
        keepalive 4;
    }

    upstream economics_upstream {
        server api.worldbank.org:443;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Gateway always;

        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location = /nginx_status {
            stub_status;
            access_log off;
            allow 172.16.0.0/12;
            allow 172.17.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        location /api/weather/ {
            limit_req zone=weather_limit burst=20 nodelay;
            proxy_cache weather_cache;
            proxy_cache_valid 429 900s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 8s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;

            proxy_ssl_server_name on;
            proxy_ssl_name api.open-meteo.com;
            proxy_set_header Host api.open-meteo.com;
            proxy_pass https://weather_upstream/;
        }

        location /api/fx/ {
            limit_req zone=fx_limit burst=10 nodelay;
            proxy_cache fx_cache;
            proxy_cache_valid 429 900s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 2m;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_ssl_server_name on;
            proxy_ssl_name open.er-api.com;
            proxy_set_header Host open.er-api.com;
            proxy_pass https://fx_upstream/;
        }

        location /api/flights/ {
            limit_req zone=flights_limit burst=3 nodelay;
            limit_rate 500k;
            limit_rate_after 1m;

            proxy_cache flights_cache;
            proxy_cache_valid 429 900s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 20s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 25s;

            proxy_ssl_server_name on;
            proxy_ssl_name opensky-network.org;
            proxy_set_header Host opensky-network.org;
            proxy_pass https://flights_upstream/;
        }

        location /api/vessels/ {
            limit_req zone=vessels_limit burst=3 nodelay;
            proxy_cache vessels_cache;
            proxy_cache_valid 429 900s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

            proxy_ssl_server_name on;
            proxy_ssl_name ais.openwaters.io;
            proxy_set_header Host ais.openwaters.io;
            proxy_pass https://vessels_upstream/;
        }

        location /api/economics/ {
            limit_req zone=econ_limit burst=5 nodelay;
            proxy_cache econ_cache;
            proxy_cache_valid 429 900s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

            proxy_ssl_server_name on;
            proxy_ssl_name api.worldbank.org;
            proxy_set_header Host api.worldbank.org;
            proxy_pass https://economics_upstream/;
        }

        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405 '{"error":"method_not_allowed"}\n';
        }

        location / {
            return 404 '{"error":"not_found","hint":"try /api/weather/, /api/fx/, /api/flights/, /api/vessels/, /api/economics/"}\n';
            add_header Content-Type application/json always;
        }
    }
}
