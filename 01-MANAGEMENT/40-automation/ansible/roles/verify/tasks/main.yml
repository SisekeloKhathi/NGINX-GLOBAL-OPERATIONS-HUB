---
- name: Check NGINX process is running
  ansible.builtin.command: docker exec nginx-public-data-gateway pgrep nginx
  register: verify_nginx_proc
  changed_when: false
  failed_when: verify_nginx_proc.rc != 0

- name: Check NGINX config syntax
  ansible.builtin.command: docker exec nginx-public-data-gateway nginx -t
  register: verify_nginx_test
  changed_when: false
  failed_when: verify_nginx_test.rc != 0

- name: Check Postgres is accepting connections
  ansible.builtin.command: docker exec postgres pg_isready -U admin -d ops_db
  register: verify_pg_ready
  changed_when: false
  failed_when: verify_pg_ready.rc != 0

- name: Check required tables exist in ops_db
  ansible.builtin.shell: >
    docker exec postgres psql -U admin -d ops_db -tAc
    "SELECT COUNT(*) FROM information_schema.tables
     WHERE table_name IN ('fx_rates','weather_data','flight_states','economic_data','automation_events','automation_state');"
  register: verify_tables
  changed_when: false
  failed_when: verify_tables.stdout | int < 6

- name: Check Grafana HTTP health endpoint
  ansible.builtin.command: docker exec grafana wget -qO- http://localhost:3000/api/health
  register: verify_grafana_health
  changed_when: false
  failed_when: '"ok" not in verify_grafana_health.stdout'

- name: Report success
  ansible.builtin.debug:
    msg: "All checks passed - NGINX, Postgres, Grafana healthy, schema present."
