name: fx_collector_stale
description: No new FX data in 5 minutes
severity: critical
enabled: true
trigger:
  type: sql
  query: |
    SELECT EXTRACT(EPOCH FROM (now() - MAX(timestamp))) FROM fx_rates
condition:
  comparator: above
  threshold: 300
actions:
  - type: log_event
  - type: webhook
    url: ${WEBHOOK_URL}
    body:
      text: "FX collector stale: {{ observed_value }}s since last row"
cooldown_seconds: 600
