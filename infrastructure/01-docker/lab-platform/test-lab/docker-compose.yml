services:

  nginx:
    extends:
      file: ../compose/base.yml
      service: nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - lab-network

  backend:
    extends:
      file: ../compose/base.yml
      service: backend
    build:
      context: ./backend
    command: python app.py
    networks:
      - lab-network

networks:

  lab-network:
    driver: bridge
